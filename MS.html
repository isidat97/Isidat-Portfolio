<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mashhuda ✿ Her Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#211934;
    --violet:#5B3E86;
    --coral:#FF7F66;
    --peach:#FFC98B;
    --cream:#FFF3E4;
    --gold:#FFD98A;
    --display:'Fraunces', serif;
    --script:'Caveat', cursive;
    --sans:'Outfit', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--night);
    color:var(--cream);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  ::selection{background:var(--gold); color:var(--night);}
  button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  /* ---------- ambient sky ---------- */
  #sky{position:fixed; inset:0; z-index:0; background:linear-gradient(180deg,#1A1330 0%,#3B2A5C 38%,#8A5A79 70%,#FF9666 100%);}
  .star{position:absolute; background:var(--gold); border-radius:50%; opacity:.8; animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.2; transform:scale(.8);}50%{opacity:.9; transform:scale(1.2);}}
  .orb{position:absolute; border-radius:50%; filter:blur(1px); opacity:.5; animation:floaty linear infinite;}
  @keyframes floaty{0%{transform:translateY(0);}50%{transform:translateY(-18px);}100%{transform:translateY(0);}}

  /* ---------- story shell ---------- */
  #story{position:fixed; inset:0; z-index:2;}
  .progress-row{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; gap:5px; padding:12px 12px 0;
  }
  .seg{flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,0.25); overflow:hidden;}
  .seg-fill{height:100%; width:0%; background:var(--gold); transform-origin:left;}
  .seg.done .seg-fill{width:100%;}
  .seg.active .seg-fill{animation:fillbar linear forwards; animation-duration:var(--dur,4s);}
  @keyframes fillbar{from{width:0%;} to{width:100%;}}

  .tap-zone{position:fixed; top:0; bottom:0; width:34%; z-index:15;}
  #tap-prev{left:0;}
  #tap-next{right:0;}

  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:90px 26px 60px; opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .slide.active{opacity:1; pointer-events:auto; z-index:5;}
  .eyebrow{font-size:.68rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin-bottom:14px;}
  .display-lg{font-family:var(--display); font-style:italic; font-weight:600; font-size:clamp(1.7rem,7vw,2.4rem); line-height:1.25;}
  .script-lg{font-family:var(--script); font-size:clamp(2.6rem,13vw,3.8rem); color:var(--gold); line-height:1;}

  /* ---------- intro gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; background:radial-gradient(circle at 50% 30%,#3B2A5C,#1A1330 75%);
    transition:opacity .8s ease, visibility .8s ease;
  }
  #gate.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .gate-star{
    width:80px; height:80px; margin-bottom:28px; cursor:pointer;
    animation:pulse-star 2.2s ease-in-out infinite;
  }
  @keyframes pulse-star{0%,100%{transform:scale(1); filter:drop-shadow(0 0 8px rgba(255,217,138,0.5));} 50%{transform:scale(1.08); filter:drop-shadow(0 0 20px rgba(255,217,138,0.85));}}
  .gate-title{font-family:var(--script); font-size:2.1rem; color:var(--gold); margin-bottom:8px;}
  .gate-sub{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--cream); opacity:.75;}

  /* ---------- hero slide ---------- */
  .hero-name{font-family:var(--script); font-size:clamp(3.2rem,17vw,5rem); color:var(--gold); line-height:1; margin:6px 0 16px;}
  .hero-line{font-family:var(--display); font-style:italic; font-size:clamp(1rem,4.4vw,1.2rem); max-width:320px; opacity:.92;}

  /* ---------- letter slides ---------- */
  .letter-text{font-family:var(--display); font-style:italic; font-size:clamp(1.15rem,5vw,1.4rem); line-height:1.75; max-width:380px;}
  .letter-sign{font-family:var(--script); font-size:1.8rem; color:var(--gold); margin-top:24px;}

  /* ---------- photo slides ---------- */
  .photo-slide{padding:70px 20px 60px; justify-content:flex-end;}
  .photo-frame{
    position:absolute; inset:0; z-index:-1; overflow:hidden;
  }
  .photo-frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-frame::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(26,19,48,0.15) 0%,rgba(26,19,48,0.05) 45%,rgba(26,19,48,0.9) 100%);}
  .photo-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,var(--violet),var(--night));
  }
  .photo-fallback span{font-family:var(--script); font-size:2.4rem; color:rgba(255,217,138,0.5);}
  .photo-cap{font-family:var(--script); font-size:2rem; color:var(--gold); position:relative; z-index:1; text-shadow:0 4px 18px rgba(0,0,0,0.5);}

  /* ---------- quote slides ---------- */
  .quote-mark{font-family:var(--display); font-size:3rem; color:var(--gold); opacity:.6; line-height:.5; margin-bottom:10px;}
  .quote-text{font-family:var(--script); font-size:clamp(1.7rem,7vw,2.3rem); color:var(--cream); line-height:1.4; max-width:340px;}

  /* ---------- finale / prank ---------- */
  #finale-slide{padding-top:70px;}
  .gift-box{width:150px; height:130px; position:relative; cursor:pointer; margin-bottom:10px;}
  .gift-lid{
    position:absolute; top:0; left:-6px; right:-6px; height:38px; background:linear-gradient(160deg,var(--coral),#E85C3F);
    border-radius:8px; transition:transform .6s cubic-bezier(.6,.05,.3,1), opacity .6s ease;
    transform-origin:bottom;
  }
  .gift-lid::before{content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:24px; height:24px; background:var(--gold); border-radius:50% 50% 0 0/60% 60% 0 0;}
  .gift-base{
    position:absolute; top:34px; left:0; right:0; bottom:0; background:linear-gradient(160deg,#FF9B84,var(--coral));
    border-radius:6px;
  }
  .gift-ribbon{position:absolute; top:34px; left:50%; transform:translateX(-50%); width:18px; bottom:0; background:var(--gold); opacity:.9;}
  #finale-slide.opened .gift-lid{transform:translateY(-70px) rotate(-18deg); opacity:0;}
  .gift-hint{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); opacity:.8; margin-top:14px;}
  #finale-slide.opened .gift-hint{opacity:0;}

  .sticker-wrap{
    position:relative; width:220px; height:220px; margin-top:6px;
    opacity:0; transform:scale(.3) rotate(-14deg);
    transition:opacity .5s ease, transform .6s cubic-bezier(.34,1.56,.64,1);
  }
  #finale-slide.opened .sticker-wrap{opacity:1; transform:scale(1) rotate(-8deg);}
  .prank-msg{
    font-family:var(--script); font-size:1.9rem; color:var(--gold); margin-top:18px; opacity:0; transition:opacity .6s ease .3s;
  }
  #finale-slide.opened .prank-msg{opacity:1;}
  .prank-sub{font-size:.82rem; color:var(--cream); opacity:0; max-width:280px; margin-top:8px; transition:opacity .6s ease .5s;}
  #finale-slide.opened .prank-sub{opacity:.85;}

  /* ---------- music toggle ---------- */
  #music-btn{
    position:fixed; bottom:20px; right:16px; z-index:60;
    width:50px; height:50px; border-radius:50%; border:1px solid rgba(255,217,138,0.6);
    background:rgba(33,25,52,0.6); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
  }
  #music-btn svg{width:18px; height:18px; fill:var(--gold);}
  #music-btn .disc{position:absolute; inset:5px; border-radius:50%; border:1px dashed rgba(255,217,138,0.4); animation:spin 6s linear infinite; animation-play-state:paused;}
  #music-btn.playing .disc{animation-play-state:running;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #confetti-canvas{position:fixed; inset:0; z-index:90; pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="confetti-canvas"></canvas>

<!-- INTRO GATE -->
<div id="gate">
  <svg class="gate-star" id="gate-star" viewBox="0 0 100 100">
    <polygon points="50,4 61,38 97,38 68,59 79,94 50,73 21,94 32,59 3,38 39,38" fill="#FFD98A"/>
  </svg>
  <div class="gate-title">for Mashhuda</div>
  <div class="gate-sub">tap the star to begin</div>
</div>

<div class="progress-row" id="progress-row"></div>
<div class="tap-zone" id="tap-prev" aria-hidden="true"></div>
<div class="tap-zone" id="tap-next" aria-hidden="true"></div>

<div id="story"></div>

<button id="music-btn" aria-label="Play music">
  <span class="disc"></span>
  <svg id="music-icon" viewBox="0 0 24 24"><path d="M8 19c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3c.35 0 .69.06 1 .17V4.83c0-.42.28-.79.69-.9l9-2.5c.61-.17 1.31.28 1.31.9v13.83c0-1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3c.35 0 .69.06 1 .17V6.3l-7 1.94V19z"/></svg>
</button>
<audio id="bg-audio" src="music/music.mp3" loop preload="none"></audio>

<script>
/* ============ ambient sky ============ */
const sky = document.getElementById('sky');
for(let i=0;i<40;i++){
  const s = document.createElement('div');
  s.className='star';
  const size = 1+Math.random()*2;
  s.style.width=size+'px'; s.style.height=size+'px';
  s.style.left=(Math.random()*100)+'%';
  s.style.top=(Math.random()*55)+'%';
  s.style.animationDelay=(Math.random()*3)+'s';
  sky.appendChild(s);
}
for(let i=0;i<10;i++){
  const o = document.createElement('div');
  o.className='orb';
  const size = 6+Math.random()*10;
  o.style.width=size+'px'; o.style.height=size+'px';
  o.style.left=(Math.random()*100)+'%';
  o.style.top=(20+Math.random()*70)+'%';
  o.style.background = Math.random()>0.5 ? 'rgba(255,217,138,0.6)' : 'rgba(255,127,102,0.5)';
  o.style.animationDuration=(4+Math.random()*4)+'s';
  sky.appendChild(o);
}

/* ============ build slide data ============ */
const photoCaptions = [
  "That smile","So you","My favourite face","Golden, like always",
  "Camera loves you","That's the one","Pretty as always","Caught you smiling",
  "Main character","Effortless","That look","So so pretty",
  "Saving this one","Glow like that","Simply her"
];

const slides = [];
slides.push({type:'hero', dur:5});
slides.push({type:'letter1', dur:8});
slides.push({type:'letter2', dur:8});
for(let i=1;i<=15;i++){ slides.push({type:'photo', idx:i, cap:photoCaptions[i-1], dur:3.4}); }
const quotes = [
  "You are my favourite hello and my hardest goodbye.",
  "Some people search for peace their whole lives — I just call you.",
  "You didn't complete me, you just made the wait worth it.",
  "I fall for you again a little every single day."
];
quotes.forEach(q=> slides.push({type:'quote', text:q, dur:4.2}));
slides.push({type:'finale', dur:null}); // manual, not auto-advancing

/* ============ render slides ============ */
const storyEl = document.getElementById('story');
const progressRow = document.getElementById('progress-row');

slides.forEach((s, i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.id = 'slide-'+i;

  if(s.type==='hero'){
    el.innerHTML = `
      <span class="eyebrow">for my favourite person</span>
      <div class="hero-name">Mashhuda</div>
      <p class="hero-line">Every monsoon brings jasmine, and every jasmine season brings me a little closer to you.</p>`;
  } else if(s.type==='letter1'){
    el.innerHTML = `
      <span class="eyebrow">before anything else</span>
      <p class="letter-text">My dearest Mashhuda, if you're reading this, it means the star has been tapped and your day is almost here.</p>
      <p class="letter-text" style="margin-top:16px;">I wanted to make you something with my own hands instead of buying you something off a shelf — because you deserve things made just for you.</p>`;
  } else if(s.type==='letter2'){
    el.innerHTML = `
      <p class="letter-text">Twenty-one years ago the world got a little softer, a little warmer, a little more worth showing up for. I get to see that every single day I know you.</p>
      <div class="letter-sign">Happy birthday, my love.</div>`;
  } else if(s.type==='photo'){
    el.className += ' photo-slide';
    el.innerHTML = `
      <div class="photo-frame">
        <img src="img/img${s.idx}.jpg" alt="" loading="lazy"
          onerror="this.parentElement.innerHTML='<div class=\\'photo-fallback\\'><span>✿</span></div>'">
      </div>
      <div class="photo-cap">${s.cap}</div>`;
  } else if(s.type==='quote'){
    el.innerHTML = `<div class="quote-mark">&ldquo;</div><p class="quote-text">${s.text}</p>`;
  } else if(s.type==='finale'){
    el.id = 'finale-slide';
    el.innerHTML = `
      <span class="eyebrow">one more thing</span>
      <div class="display-lg" style="margin-bottom:22px;">I have a gift for you</div>
      <div class="gift-box" id="gift-box">
        <div class="gift-lid"></div>
        <div class="gift-base"></div>
        <div class="gift-ribbon"></div>
      </div>
      <div class="gift-hint" id="gift-hint">tap the box</div>
      <div class="sticker-wrap" id="sticker-wrap"></div>
      <div class="prank-msg">Gotcha! 😂</div>
      <p class="prank-sub">The real one's waiting for when I see you in person.</p>`;
  }

  storyEl.appendChild(el);

  if(s.dur){
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.dataset.index = i;
    const fill = document.createElement('div');
    fill.className = 'seg-fill';
    seg.appendChild(fill);
    seg.style.setProperty('--dur', s.dur+'s');
    progressRow.appendChild(seg);
  } else {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.dataset.index = i;
    seg.style.opacity = '0';
    progressRow.appendChild(seg);
  }
});

/* ============ story engine ============ */
let current = 0;
let timer = null;
let paused = false;

function showSlide(i, direction){
  if(i<0) i=0;
  if(i>=slides.length){ return; } // stay on last

  document.querySelectorAll('.slide').forEach(el=>el.classList.remove('active'));
  document.getElementById(current===i ? ('slide-'+i) : ('slide-'+i))?.classList.add('active');
  document.getElementById('slide-'+i).classList.add('active');

  document.querySelectorAll('.seg').forEach((seg,idx)=>{
    seg.classList.remove('active','done');
    if(idx < i) seg.classList.add('done');
    if(idx === i) seg.classList.add('active');
  });

  current = i;
  clearTimeout(timer);
  const dur = slides[i].dur;
  if(dur){
    timer = setTimeout(()=> advance(1), dur*1000);
  }
}

function advance(dir){
  clearTimeout(timer);
  const next = current + dir;
  if(next >= slides.length) return; // stop at finale
  showSlide(next, dir);
}

document.getElementById('tap-next').addEventListener('click', ()=>{
  if(slides[current].type==='finale') return;
  advance(1);
});
document.getElementById('tap-prev').addEventListener('click', ()=> advance(-1));

/* pause on hold */
['touchstart','mousedown'].forEach(evt=>{
  document.addEventListener(evt, (e)=>{
    if(e.target.closest('#music-btn') || e.target.closest('#gift-box')) return;
    clearTimeout(timer); paused = true;
  });
});
['touchend','mouseup'].forEach(evt=>{
  document.addEventListener(evt, (e)=>{
    if(!paused) return;
    paused = false;
    const dur = slides[current].dur;
    if(dur){ timer = setTimeout(()=> advance(1), dur*1000); }
  });
});

/* ============ intro gate ============ */
const gate = document.getElementById('gate');
const gateStar = document.getElementById('gate-star');
gateStar.addEventListener('click', ()=>{
  gate.classList.add('hide');
  tryPlayMusic();
  showSlide(0);
});

/* ============ music ============ */
const musicBtn = document.getElementById('music-btn');
const audio = document.getElementById('bg-audio');
let musicOn = false;
function tryPlayMusic(){
  audio.play().then(()=>{ musicOn=true; musicBtn.classList.add('playing'); }).catch(()=>{});
}
musicBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(musicOn){ audio.pause(); musicOn=false; musicBtn.classList.remove('playing'); }
  else { tryPlayMusic(); }
});

/* ============ prank gift ============ */
const giftBox = document.getElementById('gift-box');
const finaleSlide = document.getElementById('finale-slide');
const stickerWrap = document.getElementById('sticker-wrap');

const stickerSVG = `
<svg viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <path id="arcpath" d="M 30 70 A 80 80 0 0 1 190 70" fill="none"/>
  </defs>
  <circle cx="110" cy="110" r="100" fill="#FFF3E4"/>
  <circle cx="110" cy="110" r="100" fill="none" stroke="#FFD98A" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g opacity="0.5">
    <line x1="110" y1="4" x2="110" y2="20" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="200" x2="110" y2="216" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="4" y1="110" x2="20" y2="110" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="110" x2="216" y2="110" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="34" y1="34" x2="46" y2="46" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="174" y1="174" x2="186" y2="186" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="186" y1="34" x2="174" y2="46" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
    <line x1="46" y1="174" x2="34" y2="186" stroke="#FF7F66" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="110" cy="118" r="62" fill="#FFC98B"/>
  <ellipse cx="78" cy="150" rx="14" ry="8" fill="#FF9B84" opacity="0.6"/>
  <ellipse cx="142" cy="150" rx="14" ry="8" fill="#FF9B84" opacity="0.6"/>
  <path d="M75 105 Q84 92 93 105" stroke="#3A2A1C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M127 105 Q136 92 145 105" stroke="#3A2A1C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M72 132 Q110 172 148 132 Q110 148 72 132 Z" fill="#3A2A1C"/>
  <path d="M84 138 Q110 156 136 138" stroke="#FFF3E4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M62 118 Q52 132 58 148" stroke="#8AC7FF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M158 118 Q168 132 162 148" stroke="#8AC7FF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text font-family="Caveat, cursive" font-size="26" fill="#FF7F66" text-anchor="middle">
    <textPath href="#arcpath" startOffset="50%">HAHA GOTCHA</textPath>
  </text>
</svg>`;

giftBox.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(finaleSlide.classList.contains('opened')) return;
  finaleSlide.classList.add('opened');
  stickerWrap.innerHTML = stickerSVG;
  launchConfetti();
});

/* ============ confetti ============ */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
function launchConfetti(){
  const colors = ['#FFD98A','#FF7F66','#FFC98B','#FFF3E4','#5B3E86'];
  const pieces = Array.from({length:120}, ()=>({
    x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.5,
    r: 4+Math.random()*5, c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2+Math.random()*3, vx: -1.5+Math.random()*3, rot: Math.random()*360, vr: -6+Math.random()*12
  }));
  let frame = 0;
  function step(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore();
    });
    if(frame<260){ requestAnimationFrame(step); } else { ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  step();
}
</script>
</body>
</html>
